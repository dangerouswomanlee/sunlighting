<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 문의 목록</title>
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="/css/contact.css">
</head>

<body>

<section class="contact-section">

    <!-- 상단 제목 -->
    <div class="contact-header">
        <div class="small-title">ADMIN</div>
        <h1 class="main-title">문의 관리</h1>
    </div>

    <!-- 검색 폼 -->
    <form th:action="@{/xk9b4m7/contact/list}" method="get" style="display:flex; gap:8px; margin-bottom:16px;">
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="제목으로 검색"
               style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px;">
        <button type="submit"
                style="padding:8px 20px; background:#1a1a2e; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px;">검색</button>
        <a th:if="${keyword != ''}" href="/xk9b4m7/contact/list"
           style="padding:8px 16px; background:#eee; color:#333; border-radius:4px; text-decoration:none; font-size:14px; line-height:1.6;">초기화</a>
    </form>

    <!-- 전체 글 개수 -->
    <div class="total-count">
        전체 <span th:text="${list.size()}">0</span>
    </div>

    <!-- 테이블 -->
    <table class="contact-table">

        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>답변 여부</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item, stat : ${list}">
            <td th:text="${list.size() - stat.index}">1</td>

            <td>
                <a th:href="@{'/xk9b4m7/contact/' + ${item.id}}">
                    <span th:text="${item.title}">제목</span>
                </a>
            </td>

            <td th:text="${item.name}">작성자</td>

            <td th:text="${#temporals.format(item.createdAt, 'yyyy.MM.dd')}">
                2025.01.01
            </td>

            <td>
                <span th:if="${item.adminReply == null}" class="status-no">미답변</span>
                <span th:if="${item.adminReply != null}" class="status-ok">답변완료</span>
            </td>
        </tr>
        </tbody>

    </table>

</section>

</body>
</html>
