spring.application.name=sunlighting
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.validation.mode=none

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

server.error.include-stacktrace=never
server.error.include-message=never

server.port=${PORT:10000}
server.forward-headers-strategy=framework

spring.mail.host=${MAIL_HOST:smtp.naver.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.naver.com}

jwt.secret=${JWT_SECRET}
jwt.expiration-hours=8
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
