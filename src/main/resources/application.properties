spring.application.name=sunlighting
spring.config.import=optional:classpath:application-local.properties

# Database (환경 변수 또는 application-local.properties 에서 주입)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Session timeout
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# 에러 정보 노출 차단
server.error.include-stacktrace=never
server.error.include-message=never

# Render server port
server.port=${PORT:10000}

# Mail (네이버 SMTP 기준 - 운영 환경에서는 환경 변수로 설정)
spring.mail.host=${MAIL_HOST:smtp.naver.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.naver.com}

# JWT (운영 환경에서는 JWT_SECRET 환경 변수로 반드시 교체)
jwt.secret=${JWT_SECRET:sunlighting-admin-jwt-default-secret-change-in-production-2024!}
jwt.expiration-hours=8
# HTTPS 환경에서는 JWT_COOKIE_SECURE=true 로 설정
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
